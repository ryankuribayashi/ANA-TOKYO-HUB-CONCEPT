  <div class="container">

  </div>

  <div class="flights-section">
    <h3 data-en="Available Flights" data-jp="利用可能なフライト">Available Flights</h3>
    <div id="flightList"></div>
  </div>

  <!-- Map panel -->
  <div class="map-panel">
    <div class="map-panel-header">
      <h3 data-en="Your Route" data-jp="あなたのルート">Your Route</h3>
    </div>
    <div id="results-map"></div>
    <div class="map-legend">
      <div class="legend-item">
        <div class="legend-dot legend-dot-hub"></div>
        <span data-en="Tokyo Hub (NRT)" data-jp="東京ハブ（NRT）">Tokyo Hub (NRT)</span>
      </div>
      <div class="legend-item">
        <div class="legend-dot legend-dot-city"></div>
        <span data-en="Your cities" data-jp="あなたの都市">Your cities</span>

    </div>
  </div>
